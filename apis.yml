aid: alterestate
name: AlterEstate
description: >-
  AlterEstate is the leading real-estate CRM SaaS for agents across Latin America, serving more
  than 5,000 agents in seven countries. Its platform centralizes leads, properties and sales in a
  visual funnel and adds a WhatsApp-integrated AI assistant (Brik), a no-code website builder, a
  unified inbox, an inter-agency inventory network, and a marketing hub. AlterEstate exposes a
  public REST API at secure.alterestate.com/api/v1 covering property listings (with backend
  currency conversion across USD, DOP, MXN, COP, CRC, GTQ and PEN), project developments
  (buildings and units), agents, geographic locations, and inbound lead submission, plus an
  OAuth-protected hosted MCP server for agentic access. Backed by 500 Global.
